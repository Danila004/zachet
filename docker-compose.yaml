services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: zachet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: P@ssw0rd
    volumes:
      - ./init-docker.sql:/docker-entrypoint-initdb.d/init-docker.sql
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/zachet
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: P@ssw0rd
    ports:
      - "8080:8080"